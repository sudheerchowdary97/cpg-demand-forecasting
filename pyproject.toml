[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpg-demand-forecasting"
version = "0.1.0"
description = "End-to-end CPG SKU-level demand forecasting with time-series deep learning."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Sudheer Chowdary" }]

# Core / light dependencies — safe to run on a laptop.
# Heavy deep-learning + MLOps deps (torch, lightning, pytorch-forecasting, darts,
# mlflow, optuna, fastapi ...) are introduced from Task 5 onward and are meant to
# run primarily on cloud GPU, NOT on this Mac.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "black>=24.4",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "ipykernel>=6.29",
]
# Tooling for generating the per-task business/developer summary workbooks
# and PepsiCo-styled branding assets (icons/banners) embedded in them.
docs = [
    "openpyxl>=3.1",
    "pillow>=10.0",
]
# Data versioning (Task 1). Local-first; a remote can be added later.
data = [
    "dvc>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sort, UP pyupgrade, B bugbear
select = ["E", "F", "I", "W", "UP", "B"]
# black owns line length and intentionally does not wrap long string literals,
# so we disable E501 (line-too-long) to avoid fighting the formatter.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
